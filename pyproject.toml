[project]
name = "depthpro-mlx"
version = "0.1.0"
description = "Apple Depth Pro (sharp monocular metric depth) ported to MLX for Apple Silicon"
readme = "README.md"
authors = [
    { name = "Nguyễn Đình Toàn", email = "ntoan199@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.2.0",
    "imageio[ffmpeg]>=2.38.1",
    "mlx>=0.32.4",
    "numpy<2",
    "opencv-python-headless>=4.11.0.86",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
]

[project.optional-dependencies]
# Converting the official PyTorch checkpoint needs torch.
convert = ["torch>=2.14.1"]

[dependency-groups]
# Reference implementation, used for parity tests and baseline benchmarks.
dev = [
    "depth-pro",
    "matplotlib>=3.11.2",
    "timm>=1.0.30",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
depthpro-mlx = "depthpro_mlx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
depth-pro = { path = "third_party/ml-depth-pro", editable = true }
