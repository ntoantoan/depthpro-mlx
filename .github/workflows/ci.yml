name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check src tests tools
      - run: uvx ruff format --check src tests tools

  test:
    # MLX needs Apple Silicon (Metal); GitHub's macos-14+ runners are arm64.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (no weights, no torch)
        run: uv sync --frozen --no-default-groups --group test
      - name: Unit tests
        run: uv run --no-sync pytest -m "not slow"
      - name: CLI entry point
        run: uv run --no-sync depthpro-mlx --help
